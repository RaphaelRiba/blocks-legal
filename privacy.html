const D = {"fr":{"titre":"Politique de confidentialité","maj":"Dernière mise à jour : {DATE}","intro":"Blocks! est un jeu de blocs gratuit édité par {EDITEUR}. Cette page explique quelles données l'application utilise, pourquoi, et comment exercer tes droits.","s":[["Ce que nous ne demandons pas","Blocks! ne demande ni compte, ni nom, ni adresse e-mail, ni numéro de téléphone. Ton score, ton record et ta partie en cours sont enregistrés uniquement sur ton appareil."],["Publicité (Google AdMob)","Le jeu est financé par la publicité, fournie par Google AdMob. Pour afficher les annonces, mesurer leur affichage et lutter contre la fraude, AdMob peut utiliser l'identifiant publicitaire de ton appareil, son modèle, sa langue, ton adresse IP et ta position approximative. Dans les pays où la loi l'exige, l'application te demande ton accord avant toute publicité personnalisée ; tu peux le retirer à tout moment dans les Réglages du jeu ou réinitialiser ton identifiant publicitaire dans les réglages de ton téléphone."],["Mesure d'audience et erreurs (Google Firebase)","Nous utilisons Firebase Analytics pour comprendre comment le jeu est utilisé (parties jouées, durée, scores, écrans vus), sans ton nom ni ton adresse e-mail, et Firebase Crashlytics pour recevoir les rapports de plantage (modèle d'appareil, version du système, déroulé de l'erreur). Ces données servent uniquement à améliorer le jeu."],["Partage et vente","Nous ne vendons aucune donnée. Les données ci-dessus sont traitées par Google, notre sous-traitant, selon ses propres règles : https://policies.google.com/privacy et https://policies.google.com/technologies/partner-sites"],["Durée de conservation","Les données du jeu restent sur ton appareil jusqu'à ce que tu désinstalles l'application. Les données de Firebase et d'AdMob sont conservées selon les durées fixées par Google, puis supprimées ou rendues anonymes."],["Enfants","Blocks! ne s'adresse pas aux enfants de moins de 13 ans et ne collecte pas sciemment de données les concernant."],["Tes droits","Tu peux demander l'accès, la rectification ou l'effacement des données qui te concernent, ou t'opposer à leur usage, en écrivant à {CONTACT}. Tu peux aussi saisir l'autorité de protection des données de ton pays."],["Modifications","Cette politique peut évoluer ; la date en haut de page indique la dernière version."]],"autre":"Conditions d'utilisation"},"en":{"titre":"Privacy Policy","maj":"Last updated: {DATE}","intro":"Blocks! is a free block game published by {EDITEUR}. This page explains what data the app collects, why, and how you can exercise your rights.","s":[["What We Don't Ask For","Blocks! doesn't require an account, name, email address, or phone number. Your score, high score, and current game progress are saved only on your device."],["Advertising (Google AdMob)","The game is funded by ads provided by Google AdMob. To show ads, measure ad performance, and prevent fraud, AdMob may use your device's advertising ID, model, language, IP address, and approximate location. Where required by law, the app asks for your consent before showing personalized ads. You can withdraw consent at any time in the game Settings or reset your advertising ID in your phone's settings."],["Usage Analytics & Crash Reporting (Google Firebase)","We use Firebase Analytics to understand how the game is used (games played, session length, scores, screens viewed) without your name or email, and Firebase Crashlytics to receive crash reports (device model, OS version, error details). This data is used solely to improve the game."],["Sharing & Selling","We do not sell any data. The data mentioned above is processed by Google, our data processor, in accordance with their own policies: https://policies.google.com/privacy and https://policies.google.com/technologies/partner-sites"],["Data Retention","Game data stays on your device until you uninstall the app. Firebase and AdMob data are kept for the periods set by Google, after which they are deleted or anonymized."],["Children","Blocks! is not directed at children under 13, and we do not knowingly collect data from them."],["Your Rights","You can request access, correction, or deletion of your data, or object to its use, by emailing {CONTACT}. You may also contact your country's data protection authority."],["Changes","This policy may be updated; the date at the top indicates the latest version."]],"autre":"Terms of Use"},"es":{"titre":"Política de privacidad","maj":"Última actualización: {DATE}","intro":"Blocks! es un juego de bloques gratuito publicado por {EDITEUR}. Esta página explica qué datos usa la aplicación, para qué y cómo puedes ejercer tus derechos.","s":[["Lo que no solicitamos","Blocks! no solicita cuenta, nombre, dirección de correo electrónico ni número de teléfono. Tu puntuación, tu récord y tu partida en curso se guardan únicamente en tu dispositivo."],["Publicidad (Google AdMob)","El juego se financia con publicidad proporcionada por Google AdMob. Para mostrar los anuncios, medir su visualización y combatir el fraude, AdMob puede usar el identificador publicitario de tu dispositivo, su modelo, su idioma, tu dirección IP y tu ubicación aproximada. En los países donde la ley lo exige, la aplicación te pedirá tu consentimiento antes de mostrar publicidad personalizada; puedes retirarlo en cualquier momento en la configuración del juego o restablecer tu identificador publicitario en la configuración de tu teléfono."],["Medición de audiencia y errores (Google Firebase)","Utilizamos Firebase Analytics para entender cómo se usa el juego (partidas jugadas, duración, puntuaciones, pantallas vistas), sin tu nombre ni tu correo electrónico, y Firebase Crashlytics para recibir informes de fallos (modelo de dispositivo, versión del sistema, secuencia del error). Estos datos se usan únicamente para mejorar el juego."],["Compartir y vender","No vendemos ningún dato. Los datos anteriores los trata Google, nuestro encargado del tratamiento, según sus propias normas: https://policies.google.com/privacy y https://policies.google.com/technologies/partner-sites"],["Plazo de conservación","Los datos del juego permanecen en tu dispositivo hasta que desinstales la aplicación. Los datos de Firebase y AdMob se conservan durante los plazos establecidos por Google y, posteriormente, se eliminan o se anonimizan."],["Menores","Blocks! no está dirigido a menores de 13 años y no recopila conscientemente datos sobre ellos."],["Tus derechos","Puedes solicitar el acceso, la rectificación o la eliminación de tus datos, o oponerte a su tratamiento, escribiendo a {CONTACT}. También puedes presentar una reclamación ante la autoridad de protección de datos de tu país."],["Modificaciones","Esta política puede actualizarse; la fecha en la parte superior indica la versión más reciente."]],"autre":"Condiciones de uso"},"de":{"titre":"Datenschutzerklärung","maj":"Letzte Aktualisierung: {DATE}","intro":"Blocks! ist ein kostenloses Blockspiel, herausgegeben von {EDITEUR}. Auf dieser Seite erfährst du, welche Daten die App verwendet, wofür und wie du deine Rechte geltend machen kannst.","s":[["Was wir nicht abfragen","Blocks! verlangt weder ein Konto, noch Namen, E-Mail-Adresse oder Telefonnummer. Dein Punktestand, dein Highscore und dein laufendes Spiel werden ausschließlich auf deinem Gerät gespeichert."],["Werbung (Google AdMob)","Das Spiel wird durch Werbung finanziert, die von Google AdMob bereitgestellt wird. Zur Anzeige der Werbung, zur Messung der Werbewirkung und zur Betrugsprävention kann AdMob die Werbekennung deines Geräts, das Gerätemodell, die Sprache, deine IP-Adresse und deinen ungefähren Standort verwenden. In Ländern, in denen dies gesetzlich vorgeschrieben ist, fragt die App vor personalisierter Werbung um deine Zustimmung; diese kannst du jederzeit in den Spieleinstellungen widerrufen oder deine Werbekennung in den Telefoneinstellungen zurücksetzen."],["Nutzungsanalyse und Fehlerberichte (Google Firebase)","Wir nutzen Firebase Analytics, um zu verstehen, wie das Spiel verwendet wird (gespielte Runden, Dauer, Punktestände, aufgerufene Bildschirme), ohne deinen Namen oder deine E-Mail-Adresse. Firebase Crashlytics erhält Absturzberichte (Gerätemodell, Systemversion, Fehlerverlauf). Diese Daten dienen ausschließlich der Verbesserung des Spiels."],["Weitergabe und Verkauf","Wir verkaufen keine Daten. Die oben genannten Daten werden von Google, unserem Auftragsverarbeiter, gemäß dessen eigenen Richtlinien verarbeitet: https://policies.google.com/privacy und https://policies.google.com/technologies/partner-sites"],["Speicherdauer","Spieldaten verbleiben auf deinem Gerät, bis du die App deinstallierst. Firebase- und AdMob-Daten werden gemäß den von Google festgelegten Fristen gespeichert und anschließend gelöscht oder anonymisiert."],["Kinder","Blocks! richtet sich nicht an Kinder unter 13 Jahren und erhebt wissentlich keine Daten in diesem Zusammenhang."],["Deine Rechte","Du kannst den Zugriff, die Berichtigung oder Löschung deiner Daten sowie Widerspruch gegen deren Nutzung geltend machen, indem du {CONTACT} kontaktierst. Alternativ kannst du dich an die zuständige Datenschutzbehörde deines Landes wenden."],["Änderungen","Diese Datenschutzerklärung kann aktualisiert werden; das Datum oben zeigt den Stand der letzten Version."]],"autre":"Nutzungsbedingungen"},"it":{"titre":"Politica sulla privacy","maj":"Ultimo aggiornamento: {DATE}","intro":"Blocks! è un gioco di blocchi gratuito pubblicato da {EDITEUR}. Questa pagina spiega quali dati utilizza l'applicazione, perché e come puoi esercitare i tuoi diritti.","s":[["Cosa non chiediamo","Blocks! non richiede un account, né nome, indirizzo e-mail o numero di telefono. Il tuo punteggio, il tuo record e la tua partita in corso vengono salvati solo sul tuo dispositivo."],["Pubblicità (Google AdMob)","Il gioco è finanziato dalla pubblicità, fornita da Google AdMob. Per mostrare le pubblicità, misurarne le visualizzazioni e contrastare le frodi, AdMob potrebbe utilizzare l'ID pubblicitario del tuo dispositivo, il modello, la lingua, il tuo indirizzo IP e la tua posizione approssimativa. Nei paesi dove la legge lo richiede, l'applicazione ti chiede il consenso prima di mostrare pubblicità personalizzate; puoi revocarlo in qualsiasi momento dalle Impostazioni del gioco o reimpostare il tuo ID pubblicitario nelle impostazioni del telefono."],["Analisi e segnalazione errori (Google Firebase)","Utilizziamo Firebase Analytics per capire come viene utilizzato il gioco (partite giocate, durata, punteggi, schermate visualizzate), senza il tuo nome o indirizzo e-mail, e Firebase Crashlytics per ricevere i report di arresto anomalo (modello del dispositivo, versione del sistema, sequenza dell'errore). Questi dati servono solo a migliorare il gioco."],["Condivisione e vendita","Non vendiamo alcun dato. I dati sopra indicati sono trattati da Google, nostro fornitore di servizi, secondo le sue norme: https://policies.google.com/privacy e https://policies.google.com/technologies/partner-sites"],["Durata della conservazione","I dati del gioco rimangono sul tuo dispositivo finché non disinstalli l'applicazione. I dati di Firebase e AdMob sono conservati per i periodi stabiliti da Google, poi eliminati o resi anonimi."],["Bambini","Blocks! non è rivolto a bambini di età inferiore a 13 anni e non raccoglie consapevolmente dati relativi a minori."],["I tuoi diritti","Puoi richiedere l'accesso, la rettifica o l'eliminazione dei tuoi dati, o opporsi al loro utilizzo, scrivendo a {CONTACT}. Puoi inoltre rivolgerti all'autorità per la protezione dei dati del tuo paese."],["Modifiche","Questa politica può subire modifiche; la data in alto indica l'ultima versione."]],"autre":"Condizioni d'uso"},"pt":{"titre":"Política de privacidade","maj":"Última atualização: {DATE}","intro":"Blocks! é um jogo de blocos gratuito publicado por {EDITEUR}. Esta página explica quais dados o aplicativo usa, por quê, e como exercer os seus direitos.","s":[["O que não pedimos","Blocks! não pede conta, nome, e-mail nem número de telefone. Sua pontuação, seu recorde e sua partida em andamento ficam salvos apenas no seu aparelho."],["Publicidade (Google AdMob)","O jogo é financiado por publicidade, fornecida pelo Google AdMob. Para exibir anúncios, medir sua exibição e combater fraudes, o AdMob pode usar o identificador de publicidade do seu aparelho, o modelo, o idioma, seu endereço IP e sua localização aproximada. Nos países onde a lei exige, o aplicativo pede o seu consentimento antes de qualquer publicidade personalizada; você pode retirá-lo a qualquer momento nos Ajustes do jogo ou redefinir o seu identificador de publicidade nas configurações do celular."],["Medição de uso e erros (Google Firebase)","Usamos o Firebase Analytics para entender como o jogo é usado (partidas jogadas, duração, pontuações, telas vistas), sem o seu nome nem o seu e-mail, e o Firebase Crashlytics para receber relatórios de falhas (modelo do aparelho, versão do sistema, sequência do erro). Esses dados servem apenas para melhorar o jogo."],["Compartilhamento e venda","Não vendemos nenhum dado. Os dados acima são tratados pelo Google, nosso operador, segundo as suas próprias regras: https://policies.google.com/privacy e https://policies.google.com/technologies/partner-sites"],["Prazo de conservação","Os dados do jogo ficam no seu aparelho até você desinstalar o aplicativo. Os dados do Firebase e do AdMob são conservados pelos prazos definidos pelo Google e depois excluídos ou anonimizados."],["Crianças","Blocks! não é destinado a crianças com menos de 13 anos e não coleta intencionalmente dados sobre elas."],["Seus direitos","Você pode pedir acesso, correção ou exclusão dos dados que dizem respeito a você, ou se opor ao seu uso, escrevendo para {CONTACT}. Você também pode recorrer à autoridade de proteção de dados do seu país."],["Alterações","Esta política pode mudar; a data no topo da página indica a versão mais recente."]],"autre":"Termos de uso"},"nl":{"titre":"Privacybeleid","maj":"Laatst bijgewerkt: {DATE}","intro":"Blocks! is een gratis blokkenspel, uitgegeven door {EDITEUR}. Op deze pagina lees je welke gegevens de app gebruikt, waarom, en hoe je je rechten uitoefent.","s":[["Wat we niet vragen","Blocks! vraagt geen account, naam, e-mailadres of telefoonnummer. Je score, je record en je lopende spel worden alleen op je toestel opgeslagen."],["Advertenties (Google AdMob)","Het spel wordt betaald met advertenties van Google AdMob. Om advertenties te tonen, de weergave te meten en fraude te bestrijden, kan AdMob de advertentie-ID van je toestel, het model, de taal, je IP-adres en je globale locatie gebruiken. In landen waar de wet dat vereist, vraagt de app eerst je toestemming voor gepersonaliseerde advertenties; je kunt die op elk moment intrekken in de Instellingen van het spel, of je advertentie-ID resetten in de instellingen van je telefoon."],["Gebruiksstatistieken en fouten (Google Firebase)","We gebruiken Firebase Analytics om te begrijpen hoe het spel wordt gebruikt (gespeelde potjes, duur, scores, bekeken schermen), zonder je naam of e-mailadres, en Firebase Crashlytics om crashrapporten te ontvangen (toestelmodel, systeemversie, verloop van de fout). Deze gegevens dienen alleen om het spel te verbeteren."],["Delen en verkopen","We verkopen geen gegevens. De gegevens hierboven worden verwerkt door Google, onze verwerker, volgens zijn eigen regels: https://policies.google.com/privacy en https://policies.google.com/technologies/partner-sites"],["Bewaartermijn","De gegevens van het spel blijven op je toestel tot je de app verwijdert. Gegevens van Firebase en AdMob worden bewaard volgens de termijnen van Google en daarna verwijderd of geanonimiseerd."],["Kinderen","Blocks! is niet bedoeld voor kinderen jonger dan 13 jaar en verzamelt niet bewust gegevens over hen."],["Je rechten","Je kunt inzage, correctie of verwijdering van je gegevens vragen, of bezwaar maken tegen het gebruik ervan, door te schrijven naar {CONTACT}. Je kunt ook een klacht indienen bij de gegevensbeschermingsautoriteit van je land."],["Wijzigingen","Dit beleid kan veranderen; de datum bovenaan de pagina geeft de laatste versie aan."]],"autre":"Gebruiksvoorwaarden"},"zh":{"titre":"隐私政策","maj":"最后更新：{DATE}","intro":"Blocks! 是由 {EDITEUR} 发行的一款免费方块游戏。本页说明应用使用哪些数据、为什么使用，以及你如何行使自己的权利。","s":[["我们不会索取的信息","Blocks! 不需要账号，也不会索取你的姓名、电子邮件地址或电话号码。你的分数、最高纪录和当前对局只保存在你的设备上。"],["广告（Google AdMob）","本游戏由广告支持，广告由 Google AdMob 提供。为了展示广告、统计广告展示情况并防止欺诈，AdMob 可能会使用你设备的广告标识符、设备型号、语言、IP 地址和大致位置。在法律有要求的国家和地区，应用会在展示个性化广告前征求你的同意；你可以随时在游戏的“设置”中撤回同意，或在手机设置中重置广告标识符。"],["使用统计与错误报告（Google Firebase）","我们使用 Firebase Analytics 了解游戏的使用情况（对局次数、时长、分数、浏览的界面），不涉及你的姓名或电子邮件地址；并使用 Firebase Crashlytics 接收崩溃报告（设备型号、系统版本、错误经过）。这些数据仅用于改进游戏。"],["共享与出售","我们不出售任何数据。上述数据由我们的服务提供商 Google 按其自身规则处理：https://policies.google.com/privacy 和 https://policies.google.com/technologies/partner-sites"],["保存期限","游戏数据保存在你的设备上，直到你卸载应用。Firebase 和 AdMob 的数据按 Google 规定的期限保存，之后删除或匿名化。"],["儿童","Blocks! 不面向 13 岁以下的儿童，也不会有意收集与他们有关的数据。"],["你的权利","你可以发送邮件至 {CONTACT}，要求查阅、更正或删除与你有关的数据，或反对对其的使用。你也可以向所在国家的数据保护机构投诉。"],["变更","本政策可能会更新；页面顶部的日期表示最新版本。"]],"autre":"使用条款"},"ar":{"titre":"سياسة الخصوصية","maj":"آخر تحديث: {DATE}","intro":"Blocks! لعبة مكعبات مجانية تنشرها {EDITEUR}. توضح هذه الصفحة البيانات التي يستخدمها التطبيق، ولماذا، وكيف تمارس حقوقك.","s":[["ما لا نطلبه منك","لا تطلب Blocks! أي حساب أو اسم أو بريد إلكتروني أو رقم هاتف. تُحفظ نتيجتك وأفضل رقم لك والجولة الجارية على جهازك فقط."],["الإعلانات (Google AdMob)","تُموَّل اللعبة بالإعلانات التي يقدمها Google AdMob. لعرض الإعلانات وقياس ظهورها ومكافحة الاحتيال، قد يستخدم AdMob المعرّف الإعلاني لجهازك وطرازه ولغته وعنوان IP وموقعك التقريبي. في البلدان التي يفرض فيها القانون ذلك، يطلب التطبيق موافقتك قبل أي إعلان مخصص؛ ويمكنك سحبها في أي وقت من إعدادات اللعبة أو إعادة ضبط المعرّف الإعلاني من إعدادات هاتفك."],["قياس الاستخدام والأخطاء (Google Firebase)","نستخدم Firebase Analytics لفهم طريقة استخدام اللعبة (الجولات الملعوبة، المدة، النتائج، الشاشات المعروضة) دون اسمك أو بريدك الإلكتروني، وFirebase Crashlytics لتلقي تقارير الأعطال (طراز الجهاز، إصدار النظام، تسلسل الخطأ). تُستخدم هذه البيانات لتحسين اللعبة فقط."],["المشاركة والبيع","لا نبيع أي بيانات. تعالج Google، بصفتها مزود خدمة لنا، البيانات المذكورة أعلاه وفق قواعدها الخاصة: https://policies.google.com/privacy و https://policies.google.com/technologies/partner-sites"],["مدة الاحتفاظ","تبقى بيانات اللعبة على جهازك حتى تحذف التطبيق. تُحفظ بيانات Firebase وAdMob للمدد التي تحددها Google، ثم تُحذف أو تُجعل مجهولة الهوية."],["الأطفال","Blocks! غير موجهة للأطفال دون 13 عامًا، ولا تجمع عمدًا أي بيانات تخصهم."],["حقوقك","يمكنك طلب الاطلاع على بياناتك أو تصحيحها أو حذفها، أو الاعتراض على استخدامها، بالكتابة إلى {CONTACT}. ويمكنك أيضًا تقديم شكوى إلى هيئة حماية البيانات في بلدك."],["التعديلات","قد تتغير هذه السياسة؛ ويشير التاريخ في أعلى الصفحة إلى آخر نسخة."]],"autre":"شروط الاستخدام"}};
const lien = s => s.replace(/(https:\/\/[^\s,;)]+)/g, '<a href="$1">$1</a>');
const remplir = s => lien(s.replace(/&/g,'&amp;').replace(/</g,'&lt;')).replaceAll('{CONTACT}', '<a href="mailto:' + CONTACT + '">' + CONTACT + '</a>').replaceAll('{EDITEUR}', EDITEUR).replaceAll('{DATE}', DATE);
function montre(l) { const d = D[l] || D.en; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
 document.title = 'Blocks! — ' + d.titre; titre.textContent = d.titre; maj.innerHTML = remplir(d.maj); intro.innerHTML = remplir(d.intro);
 corps.innerHTML = d.s.map(([h, p]) => '<h2>' + remplir(h) + '</h2><p>' + remplir(p) + '</p>').join('');
 autre.textContent = d.autre; autre.href = AUTRE_PAGE + '?lang=' + l; lang.value = l; mentions.textContent = MENTIONS; }
