const D = {"fr":{"titre":"Conditions d'utilisation","maj":"Dernière mise à jour : {DATE}","intro":"En installant ou en utilisant Blocks!, édité par {EDITEUR}, tu acceptes les conditions ci-dessous.","s":[["Le jeu","Blocks! est gratuit. Il contient de la publicité, dont des vidéos que tu peux choisir de regarder pour continuer une partie. Il n'y a aucun achat dans l'application."],["Utilisation permise","Tu peux utiliser le jeu pour ton usage personnel. Tu t'engages à ne pas le copier, le modifier, le revendre, contourner la publicité ni perturber son fonctionnement."],["Propriété","Le jeu, ses graphismes, ses sons et ses textes appartiennent à {EDITEUR} ou à ses partenaires. Aucun droit ne t'est cédé en dehors de l'usage du jeu."],["Disponibilité","Nous faisons de notre mieux pour que le jeu fonctionne bien, mais il est fourni tel quel, sans garantie. Nous pouvons le modifier, le mettre à jour ou l'arrêter à tout moment. Ta partie et ton record étant enregistrés sur ton appareil, ils peuvent être perdus si tu désinstalles le jeu."],["Responsabilité","Dans les limites permises par la loi, {EDITEUR} n'est pas responsable des dommages indirects liés à l'usage du jeu. Les annonces sont fournies par des tiers, qui en sont responsables."],["Données personnelles","L'usage de tes données est décrit dans notre politique de confidentialité."],["Droit applicable","Ces conditions sont régies par le droit français, sans priver un consommateur des protections de son pays de résidence."],["Contact","Une question ? Écris-nous à {CONTACT}."]],"autre":"Politique de confidentialité"},"en":{"titre":"Terms of Use","maj":"Last updated: {DATE}","intro":"By installing or using Blocks!, published by {EDITEUR}, you agree to the terms below.","s":[["The Game","Blocks! is free to play. It contains ads, including optional videos you can watch to continue a game. There are no in-app purchases."],["Permitted Use","You may use the game for personal use. You agree not to copy, modify, resell, bypas "],["Responsabilidad","Dentro de los límites permitidos por la ley, {EDITEUR} no será responsable de daños indirectos derivados del uso del juego. Los anuncios son proporcionados por terceros, quienes asumen la responsabilidad sobre ellos."],["Datos personales","El tratamiento de tus datos se describe en nuestra política de privacidad."],["Legislación aplicable","Estas condiciones se rigen por la legislación francesa, sin que ello prive a un consumidor de las protecciones que le otorga la ley de su país de residencia."],["Contacto","¿Tienes alguna pregunta? Escríbenos a {CONTACT}."]],"autre":"Política de privacidad"},"de":{"titre":"Nutzungsbedingungen","maj":"Letzte Aktualisierung: {DATE}","intro":"Durch die Installation oder Nutzung von Blocks!, herausgegeben von {EDITEUR}, akzeptierst du die folgenden Bedingungen.","s":[["Das Spiel","Blocks! ist kostenlos. Es enthält Werbung, darunter Videos, die du dir optional ansehen kannst, um ein Spiel fortzusetzen. In-App-Käufe gibt es nicht."],["Erlaubte Nutzung","Du kannst das Spiel zu privaten Zwecken nutzen. Du verpflichtest dich, es nicht zu kopieren, zu modifizieren, weiterzuverkaufen, die Werbung zu umgehen oder den Betrieb zu stören."],["Eigentum","Das Spiel, seine Grafiken, Sounds und Texte gehören {EDITEUR} oder dessen Partnern. Neben der Nutzung des Spiels werden dir keine weiteren Rechte eingeräumt."],["Verfügbarkeit","Wir sorgen für einen einwandfreien Betrieb, stellen das Spiel aber ohne Garantie bereit. Wir können es jederzeit ändern, aktualisieren oder einstellen. Da dein Spielstand und dein Highscore auf deinem Gerät gespeichert sind, können sie bei einer Deinstallation verloren gehen."],["Haftung","Soweit gesetzlich zulässig, haftet {EDITEUR} nicht für indirekte Schäden im Zusammenhang mit der Spielnutzung. Werbung wird von Drittanbietern bereitgestellt, die dafür verantwortlich sind."],["Personenbezogene Daten","Die Verarbeitung deiner Daten wird in unserer Datenschutzerklärung beschrieben."],["Anwendbares Recht","Diese Bedingungen unterliegen dem französischen Recht, wobei die zwingenden Verbraucherschutzbestimmungen des Landes deines Wohnsitzes unberührt bleiben."],["Kontakt","Fragen? Schreib uns an {CONTACT}."]],"autre":"Datenschutzerklärung"},"it":{"titre":"Condizioni d'uso","maj":"Ultimo aggiornamento: {DATE}","intro":"Installando o utilizzando Blocks!, pubblicato da {EDITEUR}, accetti le condizioni seguenti.","s":[["Il gioco","Blocks! è gratuito. Contiene pubblicità, inclusi video che puoi scegliere di guardare per continuare una partita. Non ci sono acquisti in-app."],["Utilizzo consentito","Puoi utilizzare il gioco per uso personale. Ti impegni a non copiarlo, modificarlo, rivenderlo, eludere la pubblicità o interferire con il suo funzionamento."],["Proprietà","Il gioco, le sue grafiche, i suoni e i testi sono di proprietà di {EDITEUR} o dei suoi partner. Nessun diritto ti viene concesso al di fuori dell'utilizzo del gioco."],["Disponibilità","Facciamo del nostro meglio per garantire il corretto funzionamento del gioco, ma viene fornito \"così com'è\", senza garanzie. Potremmo modificarlo, aggiornarlo o interromperlo in qualsiasi momento. Poiché la tua partita e il tuo record sono salvati sul dispositivo, potrebbero andare persi se disinstalli il gioco."],["Responsabilità","Nei limiti consentiti dalla legge, {EDITEUR} non è responsabile per danni indiretti derivanti dall'uso del gioco. Le pubblicità sono fornite da terze parti, che ne sono responsabili."],["Dati personali","L'utilizzo dei tuoi dati è descritto nella nostra politica sulla privacy."],["Legge applicabile","Queste condizioni sono regolate dalla legge francese, senza privare un consumatore delle tutele previste dal paese di residenza."],["Contatti","Hai una domanda? Scrivici a {CONTACT}."]],"autre":"Politica sulla privacy"},"pt":{"titre":"Termos de uso","maj":"Última atualização: {DATE}","intro":"Ao instalar ou usar Blocks!, publicado por {EDITEUR}, você aceita os termos abaixo.","s":[["O jogo","Blocks! é gratuito. Ele contém publicidade, incluindo vídeos que você pode escolher assistir para continuar uma partida. Não há nenhuma compra dentro do aplicativo."],["Uso permitido","Você pode usar o jogo para uso pessoal. Você se compromete a não copiá-lo, modificá-lo, revendê-lo, contornar a publicidade nem atrapalhar o seu funcionamento."],["Propriedade","O jogo, seus gráficos, sons e textos pertencem a {EDITEUR} ou a seus parceiros. Nenhum direito é cedido a você além do uso do jogo."],["Disponibilidade","Fazemos o possível para que o jogo funcione bem, mas ele é fornecido no estado em que se encontra, sem garantia. Podemos modificá-lo, atualizá-lo ou encerrá-lo a qualquer momento. Como sua partida e seu recorde ficam salvos no seu aparelho, eles podem ser perdidos se você desinstalar o jogo."],["Responsabilidade","Nos limites permitidos pela lei, {EDITEUR} não é responsável por danos indiretos ligados ao uso do jogo. Os anúncios são fornecidos por terceiros, que são responsáveis por eles."],["Dados pessoais","O uso dos seus dados está descrito na nossa política de privacidade."],["Lei aplicável","Estes termos são regidos pela lei francesa, sem privar o consumidor das proteções do seu país de residência."],["Contato","Alguma dúvida? Escreva para {CONTACT}."]],"autre":"Política de privacidade"},"nl":{"titre":"Gebruiksvoorwaarden","maj":"Laatst bijgewerkt: {DATE}","intro":"Door Blocks!, uitgegeven door {EDITEUR}, te installeren of te gebruiken, ga je akkoord met de voorwaarden hieronder.","s":[["Het spel","Blocks! is gratis. Het bevat advertenties, waaronder video's die je kunt kiezen om te bekijken om een potje voort te zetten. Er zijn geen aankopen in de app."],["Toegestaan gebruik","Je mag het spel voor persoonlijk gebruik gebruiken. Je kopieert, wijzigt of verkoopt het niet, omzeilt de advertenties niet en verstoort de werking niet."],["Eigendom","Het spel, de graphics, geluiden en teksten zijn van {EDITEUR} of zijn partners. Buiten het gebruik van het spel krijg je geen rechten."],["Beschikbaarheid","We doen ons best om het spel goed te laten werken, maar het wordt geleverd zoals het is, zonder garantie. We kunnen het op elk moment wijzigen, bijwerken of stopzetten. Omdat je spel en je record op je toestel staan, kunnen ze verloren gaan als je het spel verwijdert."],["Aansprakelijkheid","Voor zover de wet het toestaat, is {EDITEUR} niet aansprakelijk voor indirecte schade door het gebruik van het spel. Advertenties worden geleverd door derden, die daarvoor verantwoordelijk zijn."],["Persoonsgegevens","Hoe we je gegevens gebruiken, staat in ons privacybeleid."],["Toepasselijk recht","Op deze voorwaarden is het Franse recht van toepassing, zonder dat een consument de bescherming van zijn woonland verliest."],["Contact","Een vraag? Schrijf ons op {CONTACT}."]],"autre":"Privacybeleid"},"zh":{"titre":"使用条款","maj":"最后更新：{DATE}","intro":"安装或使用由 {EDITEUR} 发行的 Blocks!，即表示你接受以下条款。","s":[["游戏","Blocks! 免费提供。游戏中含有广告，包括你可以选择观看以继续对局的视频。应用内没有任何购买项目。"],["允许的使用","你可以将本游戏用于个人用途。你承诺不复制、修改或转售本游戏，不规避广告，也不干扰其正常运行。"],["所有权","游戏及其图形、音效和文字归 {EDITEUR} 或其合作伙伴所有。除使用游戏外，你不获得任何其他权利。"],["可用性","我们会尽力让游戏顺畅运行，但游戏按“现状”提供，不作任何保证。我们可能随时修改、更新或停止提供游戏。由于你的对局和最高纪录保存在设备上，卸载游戏后它们可能会丢失。"],["责任","在法律允许的范围内，{EDITEUR} 不对因使用游戏而产生的间接损失负责。广告由第三方提供，并由其承担责任。"],["个人数据","我们对你数据的使用方式请见隐私政策。"],["适用法律","本条款受法国法律管辖，但不剥夺消费者在其居住国享有的保护。"],["联系我们","有问题？请写信至 {CONTACT}。"]],"autre":"隐私政策"},"ar":{"titre":"شروط الاستخدام","maj":"آخر تحديث: {DATE}","intro":"بتثبيتك Blocks! التي تنشرها {EDITEUR} أو استخدامها، فإنك توافق على الشروط التالية.","s":[["اللعبة","Blocks! مجانية. تحتوي على إعلانات، منها مقاطع فيديو يمكنك اختيار مشاهدتها لمواصلة الجولة. لا توجد أي مشتريات داخل التطبيق."],["الاستخدام المسموح","يمكنك استخدام اللعبة لأغراضك الشخصية. وتلتزم بعدم نسخها أو تعديلها أو إعادة بيعها أو التحايل على الإعلانات أو تعطيل عملها."],["الملكية","اللعبة ورسومها وأصواتها ونصوصها ملك لـ {EDITEUR} أو لشركائها. لا يُمنح لك أي حق خارج استخدام اللعبة."],["التوفر","نبذل قصارى جهدنا لتعمل اللعبة جيدًا، لكنها مقدمة كما هي دون أي ضمان. ويمكننا تعديلها أو تحديثها أو إيقافها في أي وقت. ولأن جولتك وأفضل رقم لك محفوظان على جهازك، فقد يضيعان إذا حذفت اللعبة."],["المسؤولية","في الحدود التي يسمح بها القانون، لا تتحمل {EDITEUR} مسؤولية الأضرار غير المباشرة المرتبطة باستخدام اللعبة. تقدم أطراف ثالثة الإعلانات وتتحمل مسؤوليتها."],["البيانات الشخصية","يرد استخدام بياناتك في سياسة الخصوصية الخاصة بنا."],["القانون المطبق","تخضع هذه الشروط للقانون الفرنسي، دون حرمان المستهلك من الحماية التي يكفلها له بلد إقامته."],["اتصل بنا","لديك سؤال؟ راسلنا على {CONTACT}."]],"autre":"سياسة الخصوصية"}};
const lien = s => s.replace(/(https:\/\/[^\s,;)]+)/g, '<a href="$1">$1</a>');
const remplir = s => lien(s.replace(/&/g,'&amp;').replace(/</g,'&lt;')).replaceAll('{CONTACT}', '<a href="mailto:' + CONTACT + '">' + CONTACT + '</a>').replaceAll('{EDITEUR}', EDITEUR).replaceAll('{DATE}', DATE);
function montre(l) { const d = D[l] || D.en; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
 document.title = 'Blocks! — ' + d.titre; titre.textContent = d.titre; maj.innerHTML = remplir(d.maj); intro.innerHTML = remplir(d.intro);
 corps.innerHTML = d.s.map(([h, p]) => '<h2>' + remplir(h) + '</h2><p>' + remplir(p) + '</p>').join('');
 autre.textContent = d.autre; autre.href = AUTRE_PAGE + '?lang=' + l; lang.value = l; mentions.textContent = MENTIONS; }
const q = new URLSearchParams(location.search).get('lang'), nav = (navigator.language || 'en').slice(0, 2);
montre(D[q] ? q : D[nav] ? nav : 'en');
lang.onchange = e => { history.replaceState(null, '', '?lang=' + e.target.value); montre(e.target.value); };
